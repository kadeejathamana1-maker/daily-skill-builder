<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Skill Builder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Daily Skill Builder</h1>
            <p>Learn something new. Build something every day.</p>
        </header>

        <main>

            <div class="skill-card">
                <span class="day">DAY 01</span>

                <h2>Python Practice</h2>

                <p>
                    Write a Python program to count the number of vowels
                    in a sentence.
                </p>

                <button onclick="completeTask()">Mark as Completed</button>

                <p id="message"></p>
            </div>

            <div class="quote">
                <p>"Small progress every day leads to big results."</p>
            </div>

        </main>

        <footer>
            <p>© 2026 Daily Skill Builder</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
